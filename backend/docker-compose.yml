# Local development stack.
#   Infrastructure only:  docker compose up -d postgres redis keycloak mailpit
#   API + worker:         docker compose --profile app up -d --build
#   Monitoring:           docker compose --profile monitoring up -d   (Grafana: http://localhost:3001, admin/admin)
name: campussport

x-app-env: &app-env
  NODE_ENV: development
  DATABASE_URL: postgres://campussport:campussport@postgres:5432/campussport
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: dev-only-access-secret-change-me
  QR_HMAC_SECRET: dev-only-qr-secret-change-me
  COOKIE_SECURE: "false"
  # The browser and the API container must see the same issuer URL;
  # host.docker.internal resolves on Docker Desktop and through extra_hosts on Linux.
  OIDC_ISSUER: http://host.docker.internal:8080/realms/campussport
  OIDC_ALLOW_INSECURE: "true"
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: campussport
      POSTGRES_PASSWORD: campussport
      POSTGRES_DB: campussport
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campussport"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  api:
    profiles: [app]
    build: .
    environment: *app-env
    ports: ["3000:3000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    build: .
    command: ["node", "dist/worker.js"]
    environment: *app-env
    ports: ["9101:9101"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  loki:
    profiles: [monitoring]
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]

  alloy:
    profiles: [monitoring]
    image: grafana/alloy:v1.10.0
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./docker/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3001:3000"]
    depends_on: [prometheus, loki]

volumes:
  pgdata:
