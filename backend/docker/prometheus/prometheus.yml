global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # API and worker running on the host (npm run start:dev / start:worker:dev) or in the "app" profile.
  - job_name: campussport-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000', 'api:3000']
  - job_name: campussport-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9101', 'worker:9101']
