          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Blocări]
      operationId: createBlock
      summary: Blocare de urgență sau planificată
      description: |
        Algoritmul SDD 7.3, într-o singură tranzacție: anulează rezervările active care se suprapun, restituie cota și inserează blocarea. După commit, worker-ul trimite notificările cu 2–3 alternative.

        Ordinea din SRS 9.1 se aplică și între blocări: o urgență sau o mentenanță înlătură orele EF și evenimentele suprapuse (`superseded_blocks_count`). O blocare suprapusă peste una de același nivel produce `409`.

        Blocarea de urgență are nevoie doar de `resource_id`, `kind` și `reason`: începe imediat, iar `end: null` înseamnă „până la noi ordine”.
      x-min-role: admin
      x-srs: [FR-22, FR-40, FR-41, FR-42, FR-35, FR-36, FR-45, NFR-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockCreate'
            example:
              resource_id: 2c9e7a10-84b1-4f6d-a3c2-91de0f4b7a33
              kind: emergency
              reason: Avarie
              end: null
      responses:
        '201':
          description: Blocare creată. Livrarea notificărilor se urmărește cu `/admin/blocks/{id}/delivery`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Există deja o blocare de același nivel pe interval (`BLOCK_CONFLICT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/blocks/{id}:
    delete:
      tags: [Blocări]
      operationId: deleteBlock
      summary: Deblocare
      description: Încheie blocarea sau evenimentul și pornește oferta către lista de așteptare. Rezervările deja anulate nu se refac.
      x-min-role: admin
      x-srs: [FR-31, FR-40, FR-45]
      x-sdd-route: false
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Resursă deblocată.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/blocks/{id}/delivery:
    get:
      tags: [Blocări]
      operationId: getBlockDelivery
      summary: Contorul „anunțați / livrați”
      x-min-role: admin
      x-srs: [FR-41, NFR-03]
      x-sdd-route: false
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Starea livrării.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/schedule/import:
    post:
      tags: [Blocări]
      operationId: importSchedule
      summary: Import orar EF (CSV/iCal)
      description: |
        Primul pas din UC-04: validează sursa și arată conflictele, fără să modifice datele. Se trimite `file` sau `source_url`.
        Aplicarea se face cu `POST /admin/schedule/import/{id}/confirm`.

        Coloane CSV propuse: `resource_id`, `weekday`, `start_time`, `end_time`, `group`.
      x-min-role: admin
      x-srs: [FR-19, FR-22]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScheduleImportRequest'
      responses:
        '200':
          description: Previzualizarea importului.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleImportPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Fișier nevalid (`SCHEDULE_FILE_INVALID`); `details` conține rândurile greșite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/schedule/import/{id}/confirm:
    post:
      tags: [Blocări]
      operationId: confirmScheduleImport
      summary: Confirmă importul și anulează conflictele
      description: Creează blocările recurente și aplică pașii 2–3 din SDD 7.3, cu `cancel_source = pe_class`.
      x-min-role: admin
      x-srs: [FR-19, FR-20, FR-22, FR-45]
      x-sdd-route: false
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Import aplicat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleImportResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Orarul se suprapune peste o blocare de nivel superior sau egal (`BLOCK_CONFLICT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/schedule/classes:
    post:
      tags: [Blocări]
      operationId: createScheduleClass
      summary: Introducere manuală a unei ore EF recurente
      x-min-role: admin
      x-srs: [FR-19, FR-20, FR-22, FR-45]
      x-sdd-route: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleClassCreate'
      responses:
        '201':
          description: Oră EF creată.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleImportResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConflictsNeedConfirmation'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/schedule/recurrences/{id}:
    delete:
      tags: [Blocări]
      operationId: deleteScheduleRecurrence
      summary: Șterge o oră EF recurentă
      description: Anulează aparițiile viitoare și pornește oferta către lista de așteptare pentru sloturile eliberate.
      x-min-role: admin
      x-srs: [FR-19, FR-31, FR-45]
      x-sdd-route: false
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Recurență ștearsă.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/events:
    post:
      tags: [Blocări]
      operationId: createEvent
      summary: Rezervare pentru un eveniment al universității
      description: |
        Poate fi programat oricât de departe în viitor, fără fereastra de 7/14 zile.
        Dacă există rezervări suprapuse și `confirm_conflicts` este `false`, se răspunde cu `409` și lista lor. Retrimiterea cu `true` le anulează cu `cancel_source = event`, restituie cotele și notifică titularii.
      x-min-role: admin
      x-srs: [FR-21, FR-22, FR-35, FR-45]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: Eveniment creat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConflictsNeedConfirmation'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/announcements:
    post:
      tags: [Notificări]
      operationId: createAnnouncement
      summary: Anunț către utilizatorii unei resurse sau ai unui interval
      description: Se trimite cel puțin una dintre `resource_id` și `start` + `end`. Destinatarii sunt titularii rezervărilor active care se potrivesc.
      x-min-role: admin
      x-srs: [FR-38, FR-45]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementCreate'
      responses:
        '202':
          description: Anunț pus în coadă.
          content:
            application/json:
              schema:
                type: object
                required: [recipients_count]
                properties:
                  recipients_count:
                    type: integer
                    example: 23
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/settings:
    get:
      tags: [Administrare și rapoarte]
      operationId: getSettings
      summary: Citire reguli
      x-min-role: admin
      x-srs: [FR-46]
      responses:
        '200':
          description: Regulile curente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Administrare și rapoarte]
      operationId: updateSettings
      summary: Modificare reguli
      description: Regulile se citesc la fiecare cerere, deci se aplică fără redeploy. Vechile și noile valori se scriu în jurnalul de audit.
      x-min-role: admin
      x-srs: [FR-24, FR-25, FR-46, FR-45]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: Reguli salvate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/dashboard:
    get:
      tags: [Administrare și rapoarte]
      operationId: getDashboard
      summary: Panoul zilei
      description: Ziua aleasă pe toate resursele, cu check-in-uri și no-show-uri.
      x-min-role: admin
      x-srs: [FR-43]
      x-sdd-route: false
      parameters:
        - name: date
          in: query
          description: Implicit ziua curentă.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Panoul.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reports:
    get:
      tags: [Administrare și rapoarte]
      operationId: getMonthlyReport
      summary: Rapoarte lunare, export CSV/PDF
      x-min-role: admin
      x-srs: [FR-44]
      parameters:
        - name: month
          in: query
          required: true
          description: Luna raportului, `AAAA-LL`.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: 2026-10
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv, pdf]
            default: json
      responses:
        '200':
          description: Raportul, în formatul cerut.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyReport'
            text/csv:
