  /bookings:
    post:
      tags: [Rezervări]
      operationId: createBooking
      summary: Creează o rezervare
      description: |
        Algoritmul SDD 7.1, într-o singură tranzacție: cont activ → fereastră după rol → acces extern → cotă → limita de rezervări active → inserare în `occupancy`.
        Constrângerea `no_overlap` lasă să treacă exact o cerere dintre cele simultane; celelalte primesc `409` cu oferta de listă de așteptare.

        Sfârșitul slotului se calculează din `slot_minutes` al resursei.
      x-min-role: utilizator
      x-srs: [FR-03, FR-11, FR-12, FR-13, FR-18, FR-20, FR-23, FR-24, FR-25, FR-28, FR-29, NFR-01, NFR-04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
      responses:
        '201':
          description: Rezervare creată; confirmarea și reminderele sunt puse în coadă.
          headers:
            Location:
              description: URL-ul rezervării.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cont suspendat (`ACCOUNT_SUSPENDED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slot ocupat (`SLOT_TAKEN`) sau blocat (`SLOT_BLOCKED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotConflictError'
              example:
                code: SLOT_TAKEN
                message_ro: Slot ocupat. Vrei să intri pe lista de așteptare?
                message_en: Slot taken. Would you like to join the waiting list?
                waitlist_offer:
                  resource_id: 7d2f4c1e-3a5b-4e8f-9c10-2b6a1d3e5f70
                  start: '2026-11-12T18:00:00+02:00'
                  end: '2026-11-12T19:00:00+02:00'
        '422':
          description: |
            O regulă de rezervare este încălcată: `QUOTA_EXHAUSTED`, `ACTIVE_LIMIT_REACHED`, `WINDOW_EXCEEDED`, `EXTERNAL_ACCESS_DENIED`, `OUTSIDE_OPENING_HOURS`, `INVALID_SLOT` sau `RESOURCE_INACTIVE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: QUOTA_EXHAUSTED
                message_ro: Ți-ai folosit cele 4 intrări din noiembrie.
                message_en: You have used all 4 entries for November.
        '429':
          $ref: '#/components/responses/TooManyRequests'
