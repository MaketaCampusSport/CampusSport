        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/audit-log:
    get:
      tags: [Administrare și rapoarte]
      operationId: listAuditLog
      summary: Jurnal de audit
      description: Doar citire; jurnalul nu se modifică prin API.
      x-min-role: admin
      x-srs: [FR-45]
      x-sdd-route: false
      parameters:
        - name: actor
          in: query
          schema:
            type: string
            format: uuid
        - name: entity
          in: query
          schema:
            type: string
            example: resource
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Pagină din jurnal.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de acces, valabil 15 minute.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Token de reîmprospătare, în cookie `HttpOnly`, `Secure`, `SameSite=Strict`.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Cerere incorectă (`BAD_REQUEST`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Lipsește autentificarea sau a expirat (`UNAUTHENTICATED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHENTICATED
            message_ro: Te rugăm să te autentifici din nou.
            message_en: Please sign in again.
    Forbidden:
      description: Rolul sau starea contului nu permite operația (`FORBIDDEN`, `ACCOUNT_SUSPENDED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message_ro: Nu ai acces la această acțiune.
            message_en: You do not have access to this action.
    NotFound:
      description: Nu există sau nu este vizibil pentru apelant (`NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message_ro: Nu am găsit ce ai căutat.
            message_en: We could not find what you were looking for.
    UnprocessableEntity:
      description: Datele nu sunt valide sau încalcă o regulă (`VALIDATION_FAILED`); `details` indică câmpurile.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictsNeedConfirmation:
      description: Există rezervări suprapuse care trebuie confirmate pentru anulare (`CONFLICTS_NEED_CONFIRMATION`) sau o blocare de nivel superior sau egal (`BLOCK_CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictsError'
    TooManyRequests:
      description: Prea multe cereri (`RATE_LIMITED`).
      headers:
        Retry-After:
          description: Numărul de secunde după care se poate reîncerca.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message_ro: Prea multe încercări. Mai încearcă peste un minut.
            message_en: Too many attempts. Please try again in a minute.
  schemas:
    Error:
      type: object
      required: [code, message_ro, message_en]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message_ro:
          type: string
          example: Ți-ai folosit cele 4 intrări din noiembrie.
        message_en:
          type: string
          example: You have used all 4 entries for November.
        details:
          type: object
          description: Informații suplimentare, de exemplu câmpurile nevalide.
          additionalProperties: true
    ErrorCode:
      type: string
      enum:
        - BAD_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - RATE_LIMITED
        - OTP_INVALID
        - EMAIL_ALREADY_USED
        - ACCOUNT_SUSPENDED
        - EXTERNAL_ACCESS_DENIED
        - SLOT_TAKEN
        - SLOT_BLOCKED
        - QUOTA_EXHAUSTED
        - ACTIVE_LIMIT_REACHED
        - WINDOW_EXCEEDED
        - OUTSIDE_OPENING_HOURS
        - INVALID_SLOT
        - RESOURCE_INACTIVE
        - BOOKING_NOT_CANCELLABLE
        - BOOKING_NOT_ACTIVE
        - ALREADY_CHECKED_IN
        - QR_INVALID
        - CHECKIN_WINDOW_CLOSED
        - ALREADY_ON_WAITLIST
        - OFFER_TAKEN
        - OFFER_EXPIRED
        - BLOCK_CONFLICT
        - CONFLICTS_NEED_CONFIRMATION
        - SCHEDULE_FILE_INVALID
    SlotConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [waitlist_offer]
          properties:
            waitlist_offer:
              $ref: '#/components/schemas/SlotReference'
    ConflictsError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [conflicts]
          properties:
            conflicts:
              type: array
              items:
                $ref: '#/components/schemas/BookingConflict'
    BookingConflict:
      type: object
      required: [booking_id, resource_id, start, end]
      properties:
        booking_id:
          type: string
          format: uuid
        resource_id:
          type: string
          format: uuid
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        holder_name:
          type: string
          example: Ion Popescu
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total:
          type: integer
          example: 57
    Role:
      type: string
      enum: [student, teacher, external, admin]
    AccountStatus:
      type: string
      enum: [active, suspended]
    User:
      type: object
      required: [id, full_name, email, role, status]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          example: Ion Popescu
        email:
          type: string
          format: email
          example: ion.popescu@student.example.edu
        phone:
          type: string
          nullable: true
          description: Obligatoriu doar pentru externi.
          example: '+37360000000'
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/AccountStatus'
        suspended_until:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    Session:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJSUzI1NiJ9.e30.c2lnbmF0dXJl
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Durata de viață în secunde.
          example: 900
        user:
          $ref: '#/components/schemas/User'
    ExternalRegistration:
      type: object
      required: [full_name, email, phone]
      properties:
        full_name:
          type: string
          maxLength: 120
          example: Ana Rusu
        email:
          type: string
          format: email
          example: ana.rusu@example.com
        phone:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
          description: Format E.164.
          example: '+37360000001'
    OtpSent:
      type: object
      required: [expires_in]
      properties:
        expires_in:
          type: integer
          description: Valabilitatea codului, în secunde.
          example: 600
    Sport:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              example: 5b1a8e02-6c7d-4f31-b2a9-0e4d7c9f1a26
        - $ref: '#/components/schemas/SportInput'
    SportInput:
      type: object
      required: [name_ro, name_en, icon, required_equipment]
      properties:
        name_ro:
          type: string
          example: Baschet
        name_en:
          type: string
          example: Basketball
        icon:
          type: string
          example: basketball
        required_equipment:
          type: array
          description: Dotările pe care trebuie să le aibă o resursă pentru acest sport.
          items:
            type: string
          example: [panou]
    ExternalAccess:
      type: string
      description: |
        Acces pentru externi: `never` niciodată, `window` doar în `external_access_windows`, `leftover` doar sloturile rămase libere cu max. 24 h înainte.
      enum: [never, window, leftover]
    TimeRange:
      type: object
      required: [open, close]
      properties:
        open:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '07:00'
        close:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '22:00'
    WeeklyHours:
      type: object
      description: Program săptămânal; o zi lipsă înseamnă închis.
      example:
        mon:
          - open: '07:00'
            close: '22:00'
        sat:
          - open: '09:00'
            close: '18:00'
      properties:
        mon:
          type: array
          items:
            $ref: '#/components/schemas/TimeRange'
        tue:
          type: array
          items:
            $ref: '#/components/schemas/TimeRange'
        wed:
          type: array
          items:
            $ref: '#/components/schemas/TimeRange'
        thu:
          type: array
          items:
            $ref: '#/components/schemas/TimeRange'
        fri:
          type: array
          items:
            $ref: '#/components/schemas/TimeRange'
        sat:
          type: array
          items:
            $ref: '#/components/schemas/TimeRange'
        sun:
          type: array
          items:
            $ref: '#/components/schemas/TimeRange'
    ResourceInput:
      type: object
      properties:
        name:
          type: string
          example: Teren baschet 2
        type:
          type: string
          example: teren
        location:
          type: string
          description: Adresă sau coordonate pentru hartă.
          example: 47.0245,28.8322
        photo_url:
          type: string
          format: uri
          nullable: true
