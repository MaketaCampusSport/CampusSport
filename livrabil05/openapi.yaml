openapi: 3.0.3
info:
  title: CampusSport API
  version: 1.0.0
  description: |
    API REST JSON pentru **CampusSport**, sistemul de programare a bazei sportive universitare.
    Implementează interfața descrisă în SDD cap. 6 și cerințele din SRS cap. 8.

    ## Convenții
    - **Versionare:** toate rutele sunt sub `/api/v1` (SDD 6).
    - **Transport:** HTTPS cu TLS 1.2+ (NFR-08, SRS 8.3.4).
    - **Timp:** intervalele se transmit ca `start` / `end` în ISO 8601 cu fus orar; în baza de date sunt un singur `tstzrange` (`period`). Parametrii de tip `date` se interpretează în fusul orar al bazei sportive.
    - **Denumiri:** câmpurile JSON folosesc `snake_case`, ca în tabelele din SDD 5.1.
    - **Erori:** orice eroare are un `code` stabil și mesaje pentru utilizator în română și engleză (SDD 6.1).
    - **Limitare de cereri:** de exemplu 10 rezervări/minut per utilizator; la depășire se răspunde cu `429` (SDD 8.1).

    ## Coduri de eroare
    | HTTP | Coduri |
    |---|---|
    | 400 | `BAD_REQUEST` |
    | 401 | `UNAUTHENTICATED`, `OTP_INVALID` |
    | 403 | `FORBIDDEN`, `ACCOUNT_SUSPENDED` |
    | 404 | `NOT_FOUND` |
    | 409 | `SLOT_TAKEN`, `SLOT_BLOCKED`, `EMAIL_ALREADY_USED`, `BOOKING_NOT_CANCELLABLE`, `BOOKING_NOT_ACTIVE`, `ALREADY_CHECKED_IN`, `ALREADY_ON_WAITLIST`, `OFFER_TAKEN`, `BLOCK_CONFLICT`, `CONFLICTS_NEED_CONFIRMATION` |
    | 410 | `OFFER_EXPIRED` |
    | 422 | `VALIDATION_FAILED`, `QUOTA_EXHAUSTED`, `ACTIVE_LIMIT_REACHED`, `WINDOW_EXCEEDED`, `EXTERNAL_ACCESS_DENIED`, `OUTSIDE_OPENING_HOURS`, `INVALID_SLOT`, `RESOURCE_INACTIVE`, `QR_INVALID`, `CHECKIN_WINDOW_CLOSED`, `SCHEDULE_FILE_INVALID` |
    | 429 | `RATE_LIMITED` |

    ## Autentificare
    - **Membri (student, profesor, admin):** SSO prin OpenID Connect, Authorization Code + PKCE (SDD 6.3).
    - **Externi:** cont verificat prin cod OTP pe email și telefon, fără parolă.
    - **Administratori:** în plus, autentificare în doi pași (NFR-08).
    - **Sesiune:** JWT de acces valabil 15 minute, trimis ca `Authorization: Bearer`. Tokenul de reîmprospătare stă în cookie `HttpOnly`, `Secure`, `SameSite=Strict` și este valabil 30 de zile pe telefon, respectiv 8 ore pentru administratori (SDD 8.1).

    ## Roluri
    | Valoare | Semnificație | Prioritate (SRS 3.3) |
    |---|---|---|
    | `teacher` | Cadru didactic | 1 |
    | `student` | Student | 2 |
    | `external` | Persoană externă | 3 |
    | `admin` | Administrator al bazei sportive | – |

    Fiecare operație indică rolul minim în `x-min-role` și cerințele SRS acoperite în `x-srs`.
    `x-sdd-route: false` marchează rutele care nu sunt în lista „rute principale” din SDD 6.1, dar sunt necesare pentru cerințele SRS.
  x-documents:
    - MA-Software Requirements Specifications - Sistem de programare a bazei sportive universitare
    - MA-Software Design Descriptions - Sistem de programare a bazei sportive universitare
servers:
  - url: https://campussport.example/api/v1
    description: Producție (domeniu orientativ, se stabilește la implementare)
  - url: https://test.campussport.example/api/v1
    description: Testare (domeniu orientativ)
  - url: http://localhost:3000/api/v1
    description: Dezvoltare locală
tags:
  - name: Auth
    description: Login SSO, înregistrare externi cu OTP, sesiuni, cont, suspendare (FR-01, FR-02, FR-05, NFR-11).
  - name: Catalog
    description: Sporturi, resurse, dotări, program de funcționare, filtrare după sport (FR-04, FR-06 – FR-08, FR-39).
  - name: Disponibilitate
    description: Grila de sloturi și actualizări în timp real (FR-09, FR-10, SRS 8.3.4).
  - name: Rezervări
    description: Creare, anulare, check-in, QR semnat, istoric, calendar (FR-03, FR-11 – FR-18, FR-23, FR-24).
  - name: Cote
    description: Contorul lunar per student (FR-25 – FR-29).
  - name: Listă de așteptare
    description: Înscrieri, abonări la zi + sport, oferte pentru locuri eliberate (FR-30 – FR-33).
  - name: Notificări
    description: Dispozitive push și canale preferate (FR-34 – FR-38).
  - name: Blocări
    description: Blocări de urgență și mentenanță, orar EF, evenimente; anularea rezervărilor afectate (FR-19 – FR-22, FR-40 – FR-42).
  - name: Administrare și rapoarte
    description: Setări, panou zilnic, rapoarte, jurnal de audit (FR-43 – FR-46).
security:
  - bearerAuth: []
paths:
  /auth/sso/login:
    get:
      tags: [Auth]
      operationId: ssoLogin
      summary: Redirecționare către SSO-ul universității
      description: Pornește fluxul OpenID Connect Authorization Code + PKCE. Starea și `code_verifier` sunt păstrate de server.
      x-min-role: public
      x-srs: [FR-01]
      security: []
      parameters:
        - name: return_to
          in: query
          description: Ruta din PWA la care se revine după autentificare.
          schema:
            type: string
            example: /start
      responses:
        '302':
          description: Redirecționare către furnizorul de identitate.
          headers:
            Location:
              description: URL-ul de autorizare al furnizorului SSO.
              schema:
                type: string
                format: uri
  /auth/sso/callback:
    get:
      tags: [Auth]
      operationId: ssoCallback
      summary: Revenire de la furnizorul SSO
      description: |
        Schimbă codul de autorizare pe token-uri, citește rolul dintr-un claim (ex. `eduPersonAffiliation`) și creează sau actualizează utilizatorul.
        Membrii primesc cookie-ul de reîmprospătare și sunt trimiși în PWA, unde clientul apelează `POST /auth/refresh`.
        Administratorii sunt trimiși mai întâi la pasul 2FA, cu un `challenge_id` în URL.
      x-min-role: public
      x-srs: [FR-01, NFR-08]
      x-sdd-route: false
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirecționare către PWA.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Cookie-ul `refresh_token`; lipsește pentru administratori până la finalizarea 2FA.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/2fa/verify:
    post:
      tags: [Auth]
      operationId: verifyTwoFactor
      summary: Al doilea pas de autentificare pentru administratori
      x-min-role: public
      x-srs: [NFR-08]
      x-sdd-route: false
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id:
                  type: string
                  format: uuid
                code:
                  type: string
                  example: '482913'
      responses:
        '200':
          description: Sesiune de administrator creată (valabilă 8 ore).
          headers:
            Set-Cookie:
              description: Cookie-ul `refresh_token`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/external/register:
    post:
      tags: [Auth]
      operationId: registerExternal
      summary: Înregistrare extern
      description: Creează un cont neverificat și trimite coduri OTP pe email și telefon.
      x-min-role: public
      x-srs: [FR-02, NFR-11]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalRegistration'
      responses:
        '202':
          description: Coduri OTP trimise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSent'
        '409':
          description: Există deja un cont cu acest email (`EMAIL_ALREADY_USED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/external/login:
    post:
      tags: [Auth]
      operationId: loginExternal
      summary: Solicitare cod OTP pentru un extern deja înregistrat
      description: Răspunde la fel și dacă emailul nu există, ca să nu dezvăluie ce conturi sunt înregistrate.
      x-min-role: public
      x-srs: [FR-02]
      x-sdd-route: false
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: ana.rusu@example.com
      responses:
        '202':
          description: Dacă există contul, s-a trimis un cod OTP pe email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/external/verify:
    post:
      tags: [Auth]
      operationId: verifyExternal
      summary: Verifică OTP și emite JWT
      description: La înregistrare sunt obligatorii ambele coduri; la o autentificare ulterioară este suficient `email_code`.
      x-min-role: public
      x-srs: [FR-02]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, email_code]
              properties:
                email:
                  type: string
                  format: email
                  example: ana.rusu@example.com
                email_code:
                  type: string
                  example: '583021'
                phone_code:
                  type: string
                  description: Obligatoriu doar la prima verificare a contului.
                  example: '190274'
      responses:
        '200':
          description: Cont verificat, sesiune creată.
          headers:
            Set-Cookie:
              description: Cookie-ul `refresh_token`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Cod OTP greșit sau expirat (`OTP_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Emite un nou JWT de acces
      x-min-role: utilizator
      x-srs: [NFR-08]
      x-sdd-route: false
      security:
        - refreshCookie: []
      responses:
        '200':
          description: JWT nou; cookie-ul este rotit.
          headers:
            Set-Cookie:
              description: Noul cookie `refresh_token`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Închide sesiunea
      x-min-role: utilizator
      x-srs: [NFR-08]
      x-sdd-route: false
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Sesiune închisă, cookie șters.
  /me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Profilul utilizatorului curent
      x-min-role: utilizator
      x-srs: [FR-01]
      x-sdd-route: false
      responses:
        '200':
          description: Profilul.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Auth]
      operationId: deleteCurrentUser
      summary: Șterge contul și datele personale
      description: Rezervările viitoare se anulează, iar istoricul rămâne doar anonimizat (SDD 5.3).
      x-min-role: utilizator
      x-srs: [NFR-11]
      x-sdd-route: false
      responses:
        '204':
          description: Cont șters.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/export:
    get:
      tags: [Auth]
      operationId: exportCurrentUserData
      summary: Descarcă datele personale (JSON)
      x-min-role: utilizator
      x-srs: [NFR-11]
      x-sdd-route: false
      responses:
        '200':
          description: Profilul, rezervările, înscrierile și preferințele utilizatorului.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/users:
    get:
      tags: [Auth]
      operationId: listUsers
      summary: Caută utilizatori
      x-min-role: admin
      x-srs: [FR-05]
      x-sdd-route: false
      parameters:
        - name: q
          in: query
          description: Text căutat în nume sau email.
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Pagină de utilizatori.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{id}/suspend:
    post:
      tags: [Auth]
      operationId: suspendUser
      summary: Suspendă temporar un cont
      description: Suspendarea automată (3 no-show-uri într-o lună, 14 zile) o face worker-ul; această rută este pentru decizia manuală.
      x-min-role: admin
      x-srs: [FR-05, FR-45]
      x-sdd-route: false
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until, reason]
              properties:
                until:
                  type: string
                  format: date-time
                  example: '2026-11-26T00:00:00+02:00'
                reason:
                  type: string
                  example: No-show-uri repetate
      responses:
        '200':
          description: Cont suspendat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users/{id}/reactivate:
    post:
      tags: [Auth]
      operationId: reactivateUser
      summary: Ridică suspendarea unui cont
      x-min-role: admin
      x-srs: [FR-05, FR-45]
      x-sdd-route: false
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cont reactivat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /sports:
    get:
      tags: [Catalog]
      operationId: listSports
      summary: Lista sporturilor cu pictograme
      x-min-role: public
      x-srs: [FR-06]
      security: []
      responses:
        '200':
          description: Sporturile disponibile.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sport'
  /resources:
    get:
      tags: [Catalog]
      operationId: listResources
      summary: Resursele cu dotările necesare sportului
      description: Cu `sport`, întoarce doar resursele care au toate dotările din `required_equipment`; la „Tenis” nu apare niciun teren fără fileu (SRS 9.5).
      x-min-role: public
      x-srs: [FR-07, FR-04]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: sport
          in: query
          description: Identificatorul sportului.
          schema:
            type: string
            format: uuid
        - name: include_inactive
          in: query
          description: Include resursele dezactivate. Ignorat dacă apelantul nu este admin.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Resursele găsite.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
  /resources/{id}:
    get:
      tags: [Catalog]
      operationId: getResource
      summary: Fișa unei resurse
      description: Fotografie, locație pe hartă, capacitate și echipament disponibil.
      x-min-role: public
      x-srs: [FR-08]
      x-sdd-route: false
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Fișa resursei.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/sports:
    post:
      tags: [Catalog]
      operationId: createSport
      summary: Adaugă un sport
      x-min-role: admin
      x-srs: [FR-39, NFR-14, FR-45]
      x-sdd-route: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SportInput'
      responses:
        '201':
          description: Sport creat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/sports/{id}:
    put:
      tags: [Catalog]
      operationId: updateSport
      summary: Modifică un sport
      x-min-role: admin
      x-srs: [FR-39, NFR-14, FR-45]
      x-sdd-route: false
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SportInput'
      responses:
        '200':
          description: Sport actualizat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/resources:
    post:
      tags: [Catalog]
      operationId: createResource
      summary: Adaugă o resursă
      x-min-role: admin
      x-srs: [FR-39, FR-04, NFR-14, FR-45]
      x-sdd-route: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ResourceInput'
                - type: object
                  required: [name, type, location, capacity, sport_ids, opening_hours]
      responses:
        '201':
          description: Resursă creată.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/resources/{id}:
    patch:
      tags: [Catalog]
      operationId: updateResource
      summary: Modifică sau dezactivează o resursă
      description: Se trimit doar câmpurile schimbate. Dezactivarea se face cu `active = false`; rezervările viitoare trebuie tratate separat printr-o blocare.
      x-min-role: admin
      x-srs: [FR-39, FR-04, FR-45]
      x-sdd-route: false
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '200':
          description: Resursă actualizată.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /availability:
    get:
      tags: [Disponibilitate]
      operationId: getAvailability
      summary: Grila de sloturi
      description: |
        Se trimite `resource` (ruta din SDD) sau `sport`, care întoarce grila tuturor resurselor compatibile, ca fluxul „sport → slot → confirmare” să rămână la 3 pași (FR-11). Lipsa ambilor parametri produce `400`.

        Vizibilitate:
        - **Public:** doar starea sloturilor, fără nume (FR-10).
        - **Utilizator:** în plus `mine` și `booking_id` pentru rezervările proprii, iar `bookable` este calculat pentru rolul său.
        - **Extern:** nu vede sloturi care încep peste mai mult de 24 h (SRS 9.5).
        - **Admin:** în plus `holder_name`.
      x-min-role: public
      x-srs: [FR-09, FR-10, FR-11, FR-20, FR-23, FR-24, NFR-01]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: resource
          in: query
          description: Identificatorul resursei.
          schema:
            type: string
            format: uuid
        - name: sport
          in: query
          description: Alternativă la `resource`. Extindere față de SDD 6.1.
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-11-12'
      responses:
        '200':
          description: Grila pentru ziua cerută.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /stream/availability:
    get:
      tags: [Disponibilitate]
      operationId: streamAvailability
      summary: Actualizări în timp real (SSE)
      description: Trimite evenimentul `slot-changed` la fiecare creare, anulare sau blocare, astfel încât grila se actualizează în sub 3 secunde. Câmpul `data` conține `resource_id`, `start`, `end` și `status` (`free`, `occupied`, `blocked`), fără date personale.
      x-min-role: public
      x-srs: [FR-09, FR-10]
      security: []
      parameters:
