- name: Install the firewall and fail2ban
  ansible.builtin.apt:
    name: [ufw, fail2ban]
    state: present

- name: Allow SSH
  community.general.ufw:
    rule: limit
    port: "{{ server_ssh_port | string }}"
    proto: tcp

- name: Allow HTTP and HTTPS (TCP, and UDP for HTTP/3)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "80", proto: tcp }
    - { port: "443", proto: tcp }
    - { port: "443", proto: udp }

- name: Enable the firewall (deny incoming by default)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Protect SSH with fail2ban
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      port = {{ server_ssh_port }}
      maxretry = 5
      bantime = 1h
  notify: Restart fail2ban

- name: Harden SSH (key-only, no root password)
  when: server_harden_ssh | bool
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-campussport.conf
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
