# Docker Engine and the Compose plugin from Docker's own repository (docs.docker.com/engine/install).
- name: Remove distribution packages that conflict with Docker CE
  ansible.builtin.apt:
    name: [docker.io, docker-doc, docker-compose, docker-compose-v2, podman-docker, containerd, runc]
    state: absent

- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'amd64' }}"]
    signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
  register: docker_repo

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: "{{ docker_repo is changed }}"

- name: Rotate container logs
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "20m", "max-file": "5" },
        "live-restore": true
      }
  notify: Restart docker

- name: Start Docker at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
