name: backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'livrabil05/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', 'livrabil05/**', '.github/workflows/backend-ci.yml']

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: campussport
          POSTGRES_PASSWORD: campussport
          POSTGRES_DB: campussport_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U campussport" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://campussport:campussport@localhost:5432/campussport_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      - run: npm run typecheck
      - name: Unit tests (incl. conformance with livrabil05/openapi.json), coverage
        run: npm run test:cov -- --coverageThreshold='{"global":{"lines":70}}'
      - name: E2E tests on PostgreSQL 18
        run: npm run test:e2e
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: campussport-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
